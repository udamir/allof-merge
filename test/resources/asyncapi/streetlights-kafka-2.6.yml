asyncapi: '2.6.0'
info:
  title: Streetlights Kafka API
  version: '1.0.0'
  description: |
    The Smartylighting Streetlights API allows you to remotely manage the city lights.

    ### Check out its awesome features:

    * Turn a specific streetlight on/off 🌃
    * Dim a specific streetlight 😎
    * Receive real-time information about environmental lighting conditions 📈
  license:
    name: Apache 2.0
    url: https://www.apache.org/licenses/LICENSE-2.0

servers:
  scram-connections:
    url: test.mykafkacluster.org:18092
    protocol: kafka-secure
    description: Test broker secured with scramSha256
    security:
      - saslScram: []
    tags:
      - name: "env:test-scram"
        description: "This environment is meant for running internal tests through scramSha256"
      - name: "kind:remote"
        description: "This server is a remote server. Not exposed by the application"
      - name: "visibility:private"
        description: "This resource is private and only available to certain users"  
  mtls-connections:
    url: test.mykafkacluster.org:28092
    protocol: kafka-secure
    description: Test broker secured with X509
    security:
      - certs: []
    tags:
      - name: "env:test-mtls"
        description: "This environment is meant for running internal tests through mtls"
      - name: "kind:remote"
        description: "This server is a remote server. Not exposed by the application"
      - name: "visibility:private"
        description: "This resource is private and only available to certain users"

defaultContentType: application/json

channels:
  smartylighting.streetlights.1.0.event.{streetlightId}.lighting.measured:
    description: The topic on which measured values may be produced and consumed.
    parameters:
      streetlightId:
        $ref: '#/components/parameters/streetlightId'
    publish:
      summary: Inform about environmental lighting conditions of a particular streetlight.
      operationId: receiveLightMeasurement
      traits:
        - $ref: '#/components/operationTraits/kafka'
      message:
        $ref: '#/components/messages/lightMeasured'

  smartylighting.streetlights.1.0.action.{streetlightId}.turn.on:
    parameters:
      streetlightId:
        $ref: '#/components/parameters/streetlightId'
    subscribe:
      operationId: turnOn
      traits:
        - $ref: '#/components/operationTraits/kafka'
      message:
        $ref: '#/components/messages/turnOnOff'

  smartylighting.streetlights.1.0.action.{streetlightId}.turn.off:
    parameters:
      streetlightId:
        $ref: '#/components/parameters/streetlightId'
    subscribe:
      operationId: turnOff
      traits:
        - $ref: '#/components/operationTraits/kafka'
      message:
        $ref: '#/components/messages/turnOnOff'

  smartylighting.streetlights.1.0.action.{streetlightId}.dim:
    parameters:
      streetlightId:
        $ref: '#/components/parameters/streetlightId'
    subscribe:
      operationId: dimLight
      traits:
        - $ref: '#/components/operationTraits/kafka'
      message:
        $ref: '#/components/messages/dimLight'

  smartylighting.streetlights.1.0.event.{streetlightId}.firmware.updated:
    description: allOf-merge fixture addition — inline message with message-level oneOf and bindings.
    parameters:
      streetlightId:
        $ref: '#/components/parameters/streetlightId'
    bindings:
      ws:
        query:
          allOf:
            - type: object
            - properties:
                token: { type: string }
    publish:
      operationId: receiveFirmwareUpdate
      bindings:
        http:
          query:
            allOf:
              - type: object
              - required: [ version ]
        kafka:
          groupId:
            allOf:
              - type: string
              - enum: [ firmware-group ]
        amqp:
          exchange:
            allOf:
              - type: string
              - minLength: 1
      message:
        oneOf:
          - $ref: '#/components/messages/firmwareUpdated'
          - $ref: '#/components/messages/firmwareUpdatedAvro'
          - name: firmwareUpdatedInline
            headers:
              allOf:
                - type: object
                - properties:
                    traceId: { type: string }
            payload:
              allOf:
                - $ref: '#/components/schemas/basePayload'
                - properties:
                    version: { type: string }

components:
  messages:
    lightMeasured:
      name: lightMeasured
      title: Light measured
      summary: Inform about environmental lighting conditions of a particular streetlight.
      contentType: application/json
      traits:
        - $ref: '#/components/messageTraits/commonHeaders'
      payload:
        $ref: "#/components/schemas/lightMeasuredPayload"
    turnOnOff:
      name: turnOnOff
      title: Turn on/off
      summary: Command a particular streetlight to turn the lights on or off.
      traits:
        - $ref: '#/components/messageTraits/commonHeaders'
      payload:
        $ref: "#/components/schemas/turnOnOffPayload"
    dimLight:
      name: dimLight
      title: Dim light
      summary: Command a particular streetlight to dim the lights.
      traits:
        - $ref: '#/components/messageTraits/commonHeaders'
      payload:
        $ref: "#/components/schemas/dimLightPayload"
    firmwareUpdated:
      name: firmwareUpdated
      schemaFormat: application/vnd.aai.asyncapi+json;version=2.6.0
      bindings:
        kafka:
          key:
            allOf:
              - type: string
              - maxLength: 36
          bindingVersion: '0.4.0'
        mqtt:
          correlationData:
            allOf:
              - type: string
              - format: uuid
      headers:
        allOf:
          - $ref: '#/components/schemas/commonHeadersSchema'
          - properties:
              x-firmware: { type: string }
      payload:
        allOf:
          - $ref: '#/components/schemas/basePayload'
          - properties:
              version: { type: string, pattern: '^\d+\.\d+\.\d+$' }
            required: [ version ]
    firmwareUpdatedAvro:
      name: firmwareUpdatedAvro
      schemaFormat: application/vnd.apache.avro;version=1.9.0
      payload:
        type: record
        name: FirmwareUpdated
        namespace: com.smartylighting
        allOf: [ { custom: attribute } ]
        fields:
          - name: allOf
            type: string
          - name: version
            type: string

  schemas:
    basePayload:
      type: object
      properties:
        sentAt:
          $ref: "#/components/schemas/sentAt"
    commonHeadersSchema:
      type: object
      properties:
        my-app-header:
          type: integer
          minimum: 0
          maximum: 100
    lightMeasuredPayload:
      allOf:
        - $ref: "#/components/schemas/basePayload"
        - type: object
          properties:
            lumens:
              type: integer
              minimum: 0
              description: Light intensity measured in lumens.
    turnOnOffPayload:
      allOf:
        - $ref: "#/components/schemas/basePayload"
        - properties:
            command:
              type: string
              enum:
                - on
                - off
              description: Whether to turn on or off the light.
          required: [ command ]
    dimLightPayload:
      type: object
      properties:
        percentage:
          description: Percentage to which the light should be dimmed to.
          allOf:
            - type: integer
              minimum: 0
            - maximum: 100
        sentAt:
          $ref: "#/components/schemas/sentAt"
    sentAt:
      type: string
      format: date-time
      description: Date and time when the message was sent.

  securitySchemes:
    saslScram:
      type: scramSha256
      description: Provide your username and password for SASL/SCRAM authentication
    certs:
      type: X509
      description: Download the certificate files from service provider

  parameters:
    streetlightId:
      description: The ID of the streetlight.
      schema:
        allOf:
          - type: string
          - minLength: 1

  messageTraits:
    commonHeaders:
      headers:
        allOf:
          - $ref: '#/components/schemas/commonHeadersSchema'
          - required: [ my-app-header ]

  operationTraits:
    kafka:
      bindings:
        kafka:
          clientId:
            allOf:
              - type: string
              - enum: ['my-app-id']
